<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法庭辩论工作台</title><script defer src="/legal-debate/app.js"></script><style>body{margin:0;background:#08111e;color:#e7eef7;font:16px/1.55 system-ui,"PingFang SC"}.app{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:start}.eyebrow{color:#31d19a;font-weight:bold;font-size:.85rem}h1{margin:3px 0}.grid{display:grid;grid-template-columns:.9fr 1.4fr .9fr;gap:14px;margin-top:22px}.card{background:#0e1c2c;border:1px solid #213449;border-radius:10px;padding:15px}.card h2{font-size:1rem;margin:0 0 12px}.field{display:grid;gap:5px;margin:10px 0;color:#8fa3b8;font-size:.84rem}select,input{padding:9px;background:#08111e;border:1px solid #213449;border-radius:7px;color:#e7eef7;font:inherit}.turn{border-left:2px solid #31d19a;padding:10px;margin:9px 0;white-space:pre-wrap}.turn.def{border-color:#ff7b7b}.turn.judge{border-color:#ffca5f}button{padding:9px 12px;border:0;border-radius:7px;background:#31d19a;color:#05251a;font-weight:800;cursor:pointer}.ghost{background:transparent;color:#e7eef7;border:1px solid #213449}.actions{display:flex;gap:8px;flex-wrap:wrap}.hint{color:#8fa3b8;font-size:.8rem}.ok{color:#31d19a;font-size:.85rem}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">家事争议 · 证据辅助研究</div><h1>婚姻财产分割案件</h1></div><div class="actions"><button class="ghost" id="endpoint">连接 API</button><button id="debate">运行原被告辩论</button></div></header><section class="grid"><article class="card"><h2>案件选择</h2><label class="field">案由<select id="cause"><option>离婚后财产纠纷</option><option>离婚纠纷（财产分割）</option><option>同居关系析产纠纷</option></select></label><label class="field">原告<select id="plaintiff"><option>配偶甲</option><option>配偶乙</option></select></label><label class="field">争点<select id="issue"><option>房产是否属于夫妻共同财产？</option><option>婚前财产增值是否应分割？</option><option>债务是否为夫妻共同债务？</option></select></label><label class="field">财产类型<select id="asset"><option>不动产</option><option>银行存款</option><option>股权与投资收益</option><option>车辆及动产</option></select></label></article><article class="card"><h2>原被告攻防</h2><div id="timeline"><div class="turn">原告：请上传购房合同、付款流水、婚姻关系材料等证据。</div><div class="turn def">被告：可提交婚前资金来源、赠与意思表示、债务用途等反证。</div><div class="turn judge">法官辅助：未绑定证据编号的陈述不会进入事实认定。</div></div></article><article class="card"><h2>证据上传与 OCR</h2><label class="field">证据立场<select id="party"><option value="plaintiff">原告</option><option value="defendant">被告</option><option value="neutral">中立材料</option></select></label><label class="field">文件<input id="file" type="file" accept=".pdf,image/*,.txt"></label><label class="field"><span><input id="ocr" type="checkbox" checked> 使用 OCR AI 读取图片/扫描 PDF</span></label><button id="upload">上传并登记哈希</button><p id="uploadStatus" class="hint">文件只会发送至已连接的服务端；OCR Key 不会暴露给浏览器。</p><p class="hint">建议：房产证、购房合同、流水、借据、聊天记录、评估报告。</p></article></section></main></body></html>
